name: Windows verification

on:
  pull_request:
  push:
    branches: [main, release-readiness]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Build, test, package, and smoke-test the ZIP
        shell: pwsh
        run: ./scripts/Build-Release.ps1
      - name: Upload verified test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: start-organizer-win-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
