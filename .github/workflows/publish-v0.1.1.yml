name: Publish v0.1.1

# One-off release completion, requested by the repository owner. The draft was
# created by run 38166293334. Drafts without a published tag must be read by ID.
# This branch is not merged into main and no application code is changed.
on:
  push:
    branches: [publish-v0.1.1]
    paths: [.github/workflows/publish-v0.1.1.yml]

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: publish-v0.1.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Taosenai/start-organizer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Taosenai/start-organizer
      TARGET_SHA: 9f47a6101b9cd85e47f1d53e1c781d82ff781a6a
      BUILD_RUN: '38166034589'
      RELEASE_TAG: v0.1.1
      RELEASE_ID: '409861231'
    steps:
      - name: Verify merged source, Windows build, and staged release identity
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/pulls/1" > pr.json
          jq -e --arg sha "$TARGET_SHA" '.merged == true and .merge_commit_sha == $sha' pr.json
          gh api "repos/$GH_REPO/git/ref/heads/main" > main.json
          jq -e --arg sha "$TARGET_SHA" '.object.sha == $sha' main.json
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > build.json
          jq -e --arg sha "$TARGET_SHA" '
            .head_sha == $sha and .head_branch == "main" and
            .event == "push" and .path == ".github/workflows/verify.yml" and
            .status == "completed" and .conclusion == "success"
          ' build.json
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > release.json
          jq -e --arg sha "$TARGET_SHA" '
            .tag_name == "v0.1.1" and .prerelease == false and .target_commitish == $sha and
            .name == "Start Menu Organizer v0.1.1" and
            ([.assets[].name] | sort) == ["SHA256SUMS.txt", "start-organizer-v0.1.1-win-x64.zip"] and
            all(.assets[]; .state == "uploaded")
          ' release.json
          tag_sha="$(gh api "repos/$GH_REPO/git/matching-refs/tags/v0.1.1" --jq '.[] | select(.ref == "refs/tags/v0.1.1") | .object.sha')"
          if [[ -n "$tag_sha" && "$tag_sha" != "$TARGET_SHA" ]]; then
            echo 'Existing tag points elsewhere; refusing to publish.' >&2
            exit 1
          fi

      - name: Compare draft downloads byte-for-byte against the Windows build
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --repo "$GH_REPO" --name start-organizer-win-x64 --dir assets
          mkdir readback
          while IFS=$'\t' read -r asset_id filename; do
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GH_REPO/releases/assets/$asset_id" > "readback/$filename"
            cmp "assets/$filename" "readback/$filename"
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' release.json)
          python3 - <<'PY'
          import hashlib
          import pathlib
          import re
          import zipfile

          folder = pathlib.Path('readback')
          name = 'start-organizer-v0.1.1-win-x64.zip'
          sums = (folder / 'SHA256SUMS.txt').read_text(encoding='ascii').strip()
          match = re.fullmatch(r'([a-f0-9]{64})  ' + re.escape(name), sums)
          if not match:
              raise SystemExit('Unexpected checksum format')
          with (folder / name).open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          if actual != match[1] or actual != 'ff9374e5077de4ffba4ff803158bab6f2a52bd8c51a25bfd7b4d250abe806ac0':
              raise SystemExit('Release archive checksum mismatch')
          with zipfile.ZipFile(folder / name) as zipped:
              names = [entry.filename.replace('\\', '/') for entry in zipped.infolist() if not entry.is_dir()]
              expected = {'start-organizer.exe', 'README.md', 'docs/configuration.md', 'docs/releasing.md'}
              if set(names) != expected or len(names) != len(expected) or zipped.testzip() is not None:
                  raise SystemExit('Unexpected or corrupt ZIP contents')
          print(f'Uploaded release assets verified byte-for-byte; SHA256 {actual}')
          PY

      - name: Publish the verified draft and confirm its tag and latest status
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.draft == true' release.json > /dev/null; then
            gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
              -F draft=false -f make_latest=true > published.json
          else
            gh api "repos/$GH_REPO/releases/$RELEASE_ID" > published.json
          fi
          jq -e --arg sha "$TARGET_SHA" '
            .draft == false and .prerelease == false and .published_at != null and
            .target_commitish == $sha and .tag_name == "v0.1.1" and (.assets | length) == 2
          ' published.json
          gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > tag.json
          jq -e --arg sha "$TARGET_SHA" '.object.type == "commit" and .object.sha == $sha' tag.json
          gh api "repos/$GH_REPO/releases/latest" > latest.json
          jq -e --argjson id "$RELEASE_ID" '.id == $id' latest.json
          {
            echo '## Published v0.1.1'
            echo
            jq -r '.html_url' published.json
            echo
            echo "Source commit: $TARGET_SHA"
            echo "Verified Windows build: $BUILD_RUN"
            cat readback/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"
